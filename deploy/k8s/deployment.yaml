apiVersion: apps/v1
kind: Deployment
metadata:
  name: inis-api
  namespace: inis
  labels:
    app.kubernetes.io/name: inis
    app.kubernetes.io/component: api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: inis
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inis
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: inis-api
          image: inis-registry.example.com/inis/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: inis-config
            - secretRef:
                name: inis-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            # §32/§34 — la sonde de disponibilité interroge le contrat réel
            # (database, redis/Valkey, broker, llm). `/v1/status` répond
            # `ready` sans rien vérifier : l'utiliser rendait un pod « prêt »
            # même base ou broker indisponible.
            httpGet:
              path: /v1/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2


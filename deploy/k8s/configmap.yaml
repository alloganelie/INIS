apiVersion: v1
kind: ConfigMap
metadata:
  name: inis-config
  namespace: inis
  labels:
    app.kubernetes.io/name: inis
    app.kubernetes.io/component: api
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  PORT: "8000"
  CORS_ORIGINS: "https://inis.example.com"
  S3_BUCKET: "inis-artifacts"
  S3_REGION: "eu-west-3"
  S3_USE_SSL: "true"
  AUTH_STRICT_MODE: "true"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"


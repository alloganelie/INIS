apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inis-api-hpa
  namespace: inis
  labels:
    app.kubernetes.io/name: inis
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inis-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80


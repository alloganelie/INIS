# Valeurs de surcouche Helm pour la production INIS (§4, §19).

replicaCount: 3

config:
  environment: "production"
  logLevel: "WARN"
  authStrictMode: "true"

resources:
  limits:
    cpu: 4000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70


name: INIS Load (§41.13)

# §41.13 exige des benchmarks « mesurés en environnement de staging ». Cette
# campagne est **manuelle** : jamais déclenchée par un push, et la suite CI
# normale (`ci.yml`) n'en dépend pas. Le rapport de campagne est archivé en
# artefact, et le job échoue si le harnais conclut en `FAIL`.

on:
  workflow_dispatch:
    inputs:
      requests:
        description: "itérations complètes (une itération = le parcours entier)"
        required: false
        default: "5"
      concurrency:
        description: "itérations menées en parallèle"
        required: false
        default: "2"
      rows:
        description: "lignes du jeu de données téléversé (donnée de benchmark)"
        required: false
        default: "25"
      scope:
        description: "portée : « staging » applique les seuils exposés"
        required: false
        default: "local"
        type: choice
        options: [local, staging]

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s --health-timeout=5s --health-retries=10
      valkey:
        # Dette n°1 — le serveur est Valkey, la variable reste `REDIS_URL`.
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
      minio:
        # §4.3 — stockage objet S3-compatible (RustFS remplace l'image MinIO retirée).
        image: rustfs/rustfs:1.0.0-rc.5
        env:
          RUSTFS_ACCESS_KEY: inis-load
          RUSTFS_SECRET_KEY: inis-load-secret
        ports: ["9000:9000"]
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      INIS_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: inis-load
      S3_SECRET_KEY: inis-load-secret
      S3_BUCKET: inis-artifacts
      S3_USE_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Start the API
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/v1/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "l'API n'a pas répondu sur /v1/health" >&2
          exit 1
      - name: Run the §41.13 campaign
        run: |
          python -m tests.load.run_load \
            --base-url http://127.0.0.1:8000 \
            --requests "${{ inputs.requests }}" \
            --concurrency "${{ inputs.concurrency }}" \
            --rows "${{ inputs.rows }}" \
            --scope "${{ inputs.scope }}" \
            --note "CI manuelle GitHub Actions : aucun fournisseur LLM externe (mode dégradé du routeur)"
      - name: Archive the campaign report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-report-${{ github.run_id }}
          path: tests/load/results/*.json
          if-no-files-found: warn

# INIS — configuration RabbitMQ (§4.4, §5).
#
# L'image `rabbitmq:3.13-management-alpine` lit ce fichier ; les identifiants
# proviennent de `RABBITMQ_DEFAULT_USER` / `RABBITMQ_DEFAULT_PASS` (compose).

# Écoute AMQP sur toutes les interfaces du conteneur.
listeners.tcp.default = 5672
# Interface de gestion (§34/§20 : inspection des files de messages).
management.tcp.port = 15672

# Le vhost `/` est celui utilisé par `AMQP_URL=amqp://...@rabbitmq:5672//`.
default_vhost = /

# Journalisation : `console` uniquement, pour rester lisible via `docker logs`.
log.console = true
log.console.level = info
log.file = false

# Limites de ressources : au-delà, il vaut mieux refuser un message que tuer le
# courtier (les files INIS sont de courtes enveloppes §5.1).
vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative = 2.0

# §5 — les enveloppes sont du JSON court ; un préchargement modéré évite qu'un
# agent lent sature un canal.
channel_max = 2047
heartbeat = 60


# INIS — configuration Prometheus (§34, §20.2).
#
# L'API expose les 14 métriques obligatoires de §34 en texte Prometheus sur
# `GET /v1/metrics?format=prometheus` : aucun exportateur tiers n'est requis.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: inis-api
    metrics_path: /v1/metrics
    params:
      format: ["prometheus"]
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: inis-api

  # Le collecteur OTel réexporte en Prometheus ce qu'il reçoit en OTLP
  # (voir docker/otel/otel-collector.yaml, exportateur sur le port 8889).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: inis-otel-collector

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]


# INIS — courtier MQTT (§4.4 « Broker AMQP/MQTT »).
#
# Transport léger pour les événements et la télémétrie. Développement local :
# écoute en clair et sans authentification, car le client MQTT d'INIS est
# optionnel. **En production**, activer `password_file` + TLS (voir §19).

listener 1883 0.0.0.0

# Développement uniquement : aucun identifiant n'est demandé.
allow_anonymous true

# Persistance minimale : les messages conservés (retained) et les files des
# clients durables survivent à un redémarrage du courtier.
persistence true

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Un client INIS n'a besoin que d'une file à la fois (événements d'un agent) :
# la limite basse évite qu'un abonné défaillant consomme la mémoire du courtier.
max_queued_messages 1000
message_size_limit 262144


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "inis"
version = "2.0.0"
description = "INIS — Intelligent Networked Information System"
# §4.1 `[V1-FIXE]` : le runtime cible de la V1 est Python 3.12 — le plancher suit
# le contrat, il ne le précède pas. `[tool.ruff] target-version` et
# `[tool.mypy] python_version` valaient déjà `3.12` ; les images Docker aussi.
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "paho-mqtt>=2.0",
    "pydantic>=2.13.5",
    "sqlalchemy[asyncio]>=2.0",
    "defusedxml>=0.7.1",
    "asyncpg",
    "alembic",
    "aio-pika",
    "httpx>=0.28.1",
    "structlog",
    "python-ulid",
    "trafilatura>=1.12",
    "readability-lxml>=0.8.1",
    "pgvector>=0.3",
    "numpy>=1.26",
    "boto3",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "polars>=1.0",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    # §36.6/§36.7 — `UploadFile` (POST /v1/requests/{id}/documents) needs the
    # multipart parser declared here, not only installed: FastAPI refuses to
    # start without it, and 0.0.6 carries CVE-2024-24762 (ReDoS on multipart
    # bodies), hence the floor.
    "python-multipart>=0.0.9",
    # §19 — CVE-patched minimum floors (2026 advisories). The floors below are
    # the highest *published* releases: `httpx` 2.12.0 and `pydantic` 2.14.2 do
    # not exist on the index (pydantic 2.14.x is alpha-only), so the max stable
    # release is pinned instead and tracked as an open debt in AGENT_STATUS.md.
    "starlette>=1.0.1",      # CVE-2026-48710 (BadHost)
    "litellm>=1.83.10",      # CVE-2026-42208 (SQL injection)
    "cryptography>=46.0.6",  # transitive via boto3
    "urllib3>=2.5.0",        # transitive via boto3
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "testcontainers",
    "ruff",
    "mypy",
    "aiosqlite>=0.19",
    "redis>=5",
    # §41.13 — le harnais de charge sert l'application sur un vrai socket
    # (`uvicorn.Server`) pour mesurer le parcours réel : le serveur est donc
    # requis par les tests. Il n'est pas déclaré en production parce que l'image
    # le fournit séparément (`docker/Dockerfile.dev`), ce qui est signalé comme
    # écart dans le rapport de lot (l'image de production, `pip install .`, ne
    # l'installe pas alors que son `CMD` l'appelle).
    "uvicorn>=0.30",
]

# ─────────────────────────────────────────────────────────────
# pytest : active la découverte des tests
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra"

# ─────────────────────────────────────────────────────────────
# ruff : configuré mais NE BLOQUE PAS la CI pour l'instant
# (sera durci quand le code sera écrit)
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
# Pas de "select" strict pour l'instant — on active les règles
# au fur et à mesure que les zones sont implémentées

# ─────────────────────────────────────────────────────────────
# mypy : configuré mais NE BLOQUE PAS la CI pour l'instant
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# PAS de "strict = true" pour l'instant
[tool.setuptools.packages.find]
include = ["app*"]